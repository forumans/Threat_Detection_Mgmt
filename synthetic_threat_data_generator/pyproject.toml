[tool.poetry]
name = "synthetic-threat-data-generator"
version = "0.1.0"
description = "Multi-agent synthetic benchmark dataset generator for the Threat Detection System (Project 2)."
authors = ["forumans"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
# Backend
fastapi = "^0.115"
uvicorn = "^0.32"
pydantic = "^2.13"
pydantic-settings = "^2.6"
sqlalchemy = "^2.0"
alembic = "^1.14"
# Agent orchestration / development
langgraph = "^1.2"
pydantic-ai = "^2.13"
# LLM abstraction (defaults to OpenAI -- see src/config.py)
litellm = "^1.92"
openai = "^2.46"
jinja2 = "^3.1"
# Translation (LLM-based by default; NLLB/MarianMT optional, see translation_engine_agent.py)
# TTS
piper-tts = "^1.5"
# Audio processing
ffmpeg-python = "^0.2"
pydub = "^0.25"
librosa = "^0.11"
soundfile = "^0.12"
# Data generation
faker = "^40.0"
mimesis = "^18.0"
# Config
pyyaml = "^6.0"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
hypothesis = "^6.115"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
